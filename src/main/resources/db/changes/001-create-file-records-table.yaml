databaseChangeLog:
  - changeSet:
      id: 1
      author: user
      changes:
        - createTable:
            tableName: file_records
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: source_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: result_path
                  type: VARCHAR(500)
