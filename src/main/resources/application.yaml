server:
  port: 8081

spring:
  application:
    name: flow-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/converter_db}
    username: ${DB_USERNAME:converter_user}
    password: ${DB_PASSWORD:postgres111}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: flow-manager-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:my_secure_minio_admin}
  secretKey: ${MINIO_SECRET_KEY:minio111}
  bucketName: ${MINIO_BUCKET:saga-file-storage}
  region: ${MINIO_REGION:us-east-1}